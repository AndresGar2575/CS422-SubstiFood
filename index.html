<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SubstiFood</title>
    <link rel="stylesheet" href="style.css" />

  <body data-page="home">
    <nav class="navbar">
        <div class="logo"><img src="images/sf-logo.png"></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="recipe_book.html">Recipe Book</a></li>
            <li><a href="ingredient_book.html">Ingredient Book</a></li>
        </ul>

    <main class="home-page">
      <div class="search-bar">
          <h1>What are you cooking today?</h1>
          <div class="sb">

                <button type="submit" aria-label="Search">
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M2 1.5v9l8-4.5z"/></svg>

            </form>
            <div id="matches"></div>
          </div>
          <button class="cook-btn" id="cook-btn" type="button" hidden>Let's Cook</button>
      </div>
    </main>
    <script src="app.js"></script>
