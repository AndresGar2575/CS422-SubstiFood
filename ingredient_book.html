<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ingredient_book</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body data-page="ingredients">
    <nav class="navbar">
        <div class="logo"><img src="images/sf-logo.png"></div>
        <ul class="nav-links">
            <li><a href="main.html">Home</a></li>
            <li><a href="recipe_book.html">Recipe Book</a></li>
            <li><a href="ingredient_book.html">Ingredient Book</a></li>
        </ul>
    </nav>

    <main class="ingredient-page">
      <h1>Ingredient Book</h1>
      <p class="intro">
        Search here for substitutions directly! Looking for a recipe instead?
        Check out <a href="recipe_book.html">the recipe book</a>.
      </p>

      <form class="ingredient-search" role="search" onsubmit="return false">
        <input id="ingredient-search" type="search" placeholder="search" aria-label="Search ingredients" autocomplete="off" />
        <button type="submit" aria-label="Search">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M2 1.5v9l8-4.5z"/></svg>
        </button>
      </form>

      <div class="ingredient-layout">
        <div class="ingredient-main">
          <section class="ingredient-grid" id="ingredient-grid"></section>
          <nav class="pager" id="pager" aria-label="Ingredient pages" hidden></nav>
        </div>
        <aside class="side-panel" id="side" aria-live="polite"></aside>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
